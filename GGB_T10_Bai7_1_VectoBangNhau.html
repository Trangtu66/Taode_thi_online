<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;font-family:Calibri,Arial,sans-serif;background:#F8FAFC;color:#1E293B}
header{background:#1E40AF;color:#fff;padding:10px 16px} header h1{margin:0;font-size:22px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#EFF4FF}

p.hd{margin:8px 16px;font-size:18px} #ggb{margin:0 8px} #loi{color:#991B1B;margin:4px 16px}

<header><h1>Tiết 1 – Vectơ bằng nhau, ngược hướng</h1><div>Bài 7. Các khái niệm mở đầu – Toán 10 · GeoGebra</div></header>
<nav><a href="GGB_T10_Bai7_1_VectoBangNhau.html" class=on>Vectơ bằng nhau, ngược hướng</a><a href="GGB_T10_Bai7_2_BaDiemThangHang.html">Ba điểm thẳng hàng</a></nav>
<p class="hd">Kéo A, B để đổi vectơ u = AB (xanh dương). Từ C: CD = u (xanh lá, bằng u), CE = −u (đỏ, cùng độ dài, ngược hướng). Kéo C đến vị trí bất kì.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["A=(0,0)", "B=(3,1)", "C=(1,-3)", "u=Vector(A,B)", "SetColor(u,\"#2563EB\")", "SetLineThickness(u,6)", "D=C+u", "w=Vector(C,D)", "SetColor(w,\"#16A34A\")", "SetLineThickness(w,6)", "E=C-u", "v=Vector(C,E)", "SetColor(v,\"#DC2626\")", "SetLineThickness(v,6)", "doDaiAB=Length(u)", "doDaiCD=Length(w)", "doDaiCE=Length(v)", "ShowGrid(true)"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"classic", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AG",
  errorDialogsActive:false,
  appletOnLoad:function(api){
    // evalCommand trả false cả với lệnh định dạng (SetColor…) vì không tạo đối tượng mới → chỉ kiểm tra lệnh định nghĩa "ten=…".
    const loi=[]; CMDS.forEach(c=>{ api.evalCommand(c); const m=c.match(/^(\w+)=/); if(m && !api.exists(m[1])) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | "); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
