<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;font-family:Calibri,Arial,sans-serif;background:#F8FAFC;color:#1E293B}
header{background:#1E40AF;color:#fff;padding:10px 16px} header h1{margin:0;font-size:22px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#EFF4FF}
nav a{padding:6px 10px;border-radius:16px;background:#fff;color:#1E40AF;text-decoration:none;border:1px solid #BFDBFE;font-size:15px}
nav a.on{background:#1E40AF;color:#fff}
p.hd{margin:8px 16px;font-size:18px} #ggb{margin:0 8px} #loi{color:#991B1B;margin:4px 16px}
</style></head><body>
<header><h1>Tiết 2 – Toạ độ vectơ theo hai đầu mút</h1><div>Bài 7. Hệ trục toạ độ trong không gian – Toán 12 · GeoGebra</div></header>
<nav><a href="GGB3D_T12_Bai7_1_ToaDoDiem.html">Toạ độ của điểm</a><a href="GGB3D_T12_Bai7_2_ToaDoVecto.html" class=on>Toạ độ vectơ theo hai đầu mút</a></nav>
<p class="hd">Kéo M, N. Vectơ MN (đỏ) có toạ độ (xN − xM; yN − yM; zN − zM). Vectơ u vẽ từ gốc O bằng MN: điểm cuối U có toạ độ đúng bằng toạ độ của MN.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["M=(1,2,1)", "N=(4,3,3)", "mn=Vector(M,N)", "SetColor(mn,\"#DC2626\")", "SetLineThickness(mn,7)", "ShowLabel(mn,false)", "U=(x(N)-x(M),y(N)-y(M),z(N)-z(M))", "O=(0,0,0)", "u=Vector(O,U)", "SetColor(u,\"#2563EB\")", "SetLineThickness(u,5)", "ShowLabel(u,false)", "toaDoMN=U", "doDaiMN=Distance(M,N)"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"3d", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AT",
  appletOnLoad:function(api){ const loi=[]; CMDS.forEach(c=>{ if(!api.evalCommand(c)) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | "); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
