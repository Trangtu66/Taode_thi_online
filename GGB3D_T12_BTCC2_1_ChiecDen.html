<header><h1>Tiết 2 – Di chuyển chiếc đèn (Bài 2.42)</h1><div>Bài tập cuối chương II – Toán 12 · GeoGebra</div></header>
<nav><a href="GGB3D_T12_BTCC2_1_ChiecDen.html" class=on>Di chuyển chiếc đèn (Bài 2.42)</a></nav>
<p class="hd">Gốc O tại góc trần; Ox, Oy theo giao tuyến của trần với hai bức tường; Oz hướng xuống (m). D1(1,2; 1,6; 0,5) là vị trí cũ, D2(1,5; 1,5; 0,4) là vị trí mới; D1D2 ≈ 0,33 m.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["O=(0,0,0)", "D1=(1.2,1.6,0.5)", "D2=(1.5,1.5,0.4)", "SetColor(D1,\"#2563EB\")", "SetColor(D2,\"#DC2626\")", "t1=(1.2,1.6,0)", "t2=(1.5,1.5,0)", "d1=Segment(t1,D1)", "SetLineStyle(d1,1)", "SetColor(d1,\"#64748B\")", "ShowLabel(d1,false)", "d2=Segment(t2,D2)", "SetLineStyle(d2,1)", "SetColor(d2,\"#64748B\")", "ShowLabel(d2,false)", "k=Segment(D1,D2)", "SetColor(k,\"#EA580C\")", "SetLineThickness(k,6)", "khoangCach=Distance(D1,D2)"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"3d", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AT",
  appletOnLoad:function(api){ const loi=[]; CMDS.forEach(c=>{ if(!api.evalCommand(c)) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | "); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
