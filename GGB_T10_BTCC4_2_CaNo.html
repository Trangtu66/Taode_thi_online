<header><h1>Bài 4.39 – Vận tốc ca nô</h1><div>Bài tập cuối chương IV – Toán 10 · GeoGebra</div></header>
<nav><a href="GGB_T10_BTCC4_1_TamGiacVuong.html">Tam giác vuông, hình bình hành</a><a href="GGB_T10_BTCC4_2_CaNo.html" class=on>Vận tốc ca nô</a></nav>
<p class="hd">Vận tốc thực tế v (đỏ, 20 km/h, hướng S15°E) = vận tốc riêng vr (xanh dương) + vận tốc dòng nước vn (xanh lá, hướng đông). Kéo thanh trượt w (km/h). Với w = 3: |vr| ≈ 19,44 km/h.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["w=Slider(0,6,0.5)", "SetValue(w,3)", "O=(0,0)", "T=(20sin(15°),-20cos(15°))", "N=T-(w,0)", "vt=Vector(O,T)", "SetColor(vt,\"#DC2626\")", "SetLineThickness(vt,8)", "vr=Vector(O,N)", "SetColor(vr,\"#2563EB\")", "SetLineThickness(vr,6)", "vn=Vector(N,T)", "SetColor(vn,\"#16A34A\")", "SetLineThickness(vn,6)", "doLonVr=Length(vr)", "ZoomIn(-10,-23,14,3)"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"classic", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AG",
  errorDialogsActive:false,
  appletOnLoad:function(api){
    // evalCommand trả false cả với lệnh định dạng (SetColor…) vì không tạo đối tượng mới → chỉ kiểm tra lệnh định nghĩa "ten=…".
    const loi=[]; CMDS.forEach(c=>{ api.evalCommand(c); const m=c.match(/^(\w+)=/); if(m && !api.exists(m[1])) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | "); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
