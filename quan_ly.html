<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const doc = k => { try{ return localStorage.getItem(k) || sessionStorage.getItem(k) || ""; }catch(e){ return ""; } };
let KHOI = doc("ql_khoi") || "";
const CONG_KHAI = window.CONG_KHAI_KET_QUA === true;
let MA = doc("ql_ma_gv"), BAI = [], CHON = "", VIEW = "xephang", LOP = "", ROWS = [], LIST = [];
function jsonp(params){
  return new Promise((res, rej)=>{
    const api = window.KQ_API || "";
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(api)) return rej("Chưa cấu hình địa chỉ nhận kết quả trong cau_hinh.js.");
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(()=>{ cleanup(); rej("Không kết nối được máy chủ kết quả (kiểm tra mạng)."); }, 20000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); d && d.ok ? res(d) : rej((d && d.loi) || "Lỗi dữ liệu"); };
    s.onerror = ()=>{ cleanup(); rej("Không kết nối được máy chủ kết quả (kiểm tra mạng)."); };
    s.src = api + "?" + new URLSearchParams({...params, callback: cb}).toString();
    document.body.appendChild(s);
  });
}
function toan(el){ try{ if(window.renderMathInElement) renderMathInElement(el, {delimiters:[{left:"$",right:"$",display:false}], throwOnError:false}); }catch(e){} }
const key = r => r.name.toLowerCase().normalize("NFC").replace(/\s+/g," ").trim() + "|" + r.lop;
const tg = s => { s = Math.max(0, s|0); return Math.floor(s/60) + " ph " + String(s%60).padStart(2,"0") + " s"; };
const ngay = t => new Date(t).toLocaleString("vi-VN", {hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit"});
function baiHienTai(){ return BAI.find(b=>b.ma===CHON) || {ten:CHON, ma:CHON}; }
function linkBai(b){ return b.link ? new URL(b.link, location.href).href : ""; }

/* ---------- đăng nhập ---------- */
let GV = null;
function hienGV(){
  const el = $("xin-chao"); if(!el || !GV) return;
  el.textContent = GV.admin ? "Đăng nhập: Quản trị (tất cả các lớp)" : "Xin chào " + GV.ten + " · " + (GV.lop.length ? "Lớp: " + GV.lop.join(", ") : "tất cả các lớp");
}
async function vao(){
  $("loi-vao").textContent = "";
  const m = MA || $("ma-gv").value.trim();
  if(!m){ $("loi-vao").textContent = "Nhập mã giáo viên."; return; }
  $("loi-vao").textContent = "Đang kiểm tra…";
  try{
    const kt = await jsonp({action:"all", key:m, quiz:"__kiem_tra__"}); GV = kt.gv || null;
    MA = m;
    try{ ($("nho").checked ? localStorage : sessionStorage).setItem("ql_ma_gv", MA); }catch(e){}

/* ---------- danh sách bài: chọn Môn → Khối → bài (gom nhóm theo loại bài) ---------- */
let MON = doc("ql_mon") || "", TIM = "";
const THU_TU_MON = ["Toán","Ngữ văn","Tiếng Anh","Vật lí","Hóa học","Sinh học","Lịch sử","Địa lí","Giáo dục kinh tế và pháp luật","Công nghệ","Tin học"];
// "Địa lí 12 · Củng cố" → môn "Địa lí", loại "Củng cố"; "Toán 12" → loại "Củng cố"
function tachNhom(b){
  const nhom = String(b.nhom || ""), m = nhom.match(/^(.*?)\s*\b(10|11|12)\b\s*(?:·\s*(.*))?$/);
  b.mon = m && m[1] ? m[1].trim() : "Khác";
  b.loai = m && m[3] ? m[3].trim() : "Củng cố";
  if(/^Chuyên đề|^Bài tập cuối chuyên đề/i.test(String(b.ten||""))) b.loai = "Chuyên đề học tập";
}
async function taiDanhSach(){
  let qz = [];
  try{ qz = (await jsonp({action:"quizzes", key:MA})).quizzes; }catch(e){}
  const cfg = (window.DANH_SACH_BAI || []).map(b=>({...b}));
  cfg.forEach(b=>{ const q = qz.find(x=>x.quizId===b.ma); b.count = q ? q.count : 0; b.last = q ? q.last : 0; });
  qz.filter(q=> !cfg.find(b=>b.ma===q.quizId)).forEach(q=>{ const t = q.title || q.quizId, m = t.match(/\(([^()]*?)\s*(10|11|12)\)\s*$/);
    cfg.push({nhom:(m ? m[1].trim() + " " + m[2] + " · " : "") + "Đề tự tạo (chưa có trong danh sách)", ten:t.replace(/^Củng cố\s*[–-]\s*/,"").replace(/\s*\([^()]*\d{2}\)\s*$/,""), ma:q.quizId, khoi:m ? m[2] : "", count:q.count, last:q.last}); });
  cfg.forEach(b=>{ if(!b.khoi){ const m = String(b.nhom||"").concat(" ", b.ma||"").match(/\b(10|11|12)\b/); b.khoi = m ? m[1] : "khac"; } b.khoi = String(b.khoi); tachNhom(b); });
  BAI = cfg;
  if(!MON || !BAI.some(b=>b.mon===MON)){
    const moi = BAI.slice().sort((a,b)=>(b.last||0)-(a.last||0))[0];
    MON = moi ? moi.mon : "Toán";
  }
  if(!CHON && BAI.length){
    const pool = BAI.filter(b=>b.mon===MON && (!KHOI || b.khoi===KHOI));
    const moi = (pool.length ? pool : BAI.filter(b=>b.mon===MON)).slice().sort((a,b)=>(b.last||0)-(a.last||0))[0];
    if(moi){ CHON = moi.ma; if(!KHOI || !pool.length) KHOI = moi.khoi; }
  }
  if(!KHOI) KHOI = "10";
  veDanhSach();
  if(CHON) await taiBai();
}
function chonBaiMacDinh(){
  const ds = BAI.filter(b=>b.mon===MON && b.khoi===KHOI);
  if(!ds.find(b=>b.ma===CHON)){
    const moi = ds.slice().sort((a,b)=>(b.last||0)-(a.last||0))[0];

}
function chonMon(m){
  MON = m; TIM = ""; try{ localStorage.setItem("ql_mon", m); }catch(e){}
  // giữ khối đang chọn nếu môn này có bài ở khối đó, nếu không chuyển sang khối có bài mới nhất
  if(!BAI.some(b=>b.mon===m && b.khoi===KHOI)){
    const moi = BAI.filter(b=>b.mon===m).sort((a,b)=>(b.last||0)-(a.last||0))[0];

function chonKhoi(k){

function veDanhSach(){

  const khop = b => !tim || String(b.ten).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").includes(tim);
  const ds = cuaMon.filter(b=>b.khoi===KHOI && khop(b));
  const loais = [...new Set(ds.map(b=>b.loai))].sort((a,b)=> (a==="Củng cố" ? -1 : b==="Củng cố" ? 1 : a.localeCompare(b,"vi")));

    <div class="so">${b.count ? `<b>${b.count}</b> lượt nộp · mới nhất ${ngay(b.last)}` : 'Chưa có bài nộp'}</div></button>`;

    : loais.map(l=>{ const nh = ds.filter(b=>b.loai===l); return `<div class="nhom-bai"><h3>${esc(l)} <span>(${nh.length})</span></h3><div class="bai-grid">${nh.map(the).join("")}</div></div>`; }).join("");
  document.querySelectorAll(".bai").forEach(el=> el.onclick = ()=>{ CHON = el.dataset.ma; LOP = ""; veDanhSach(); taiBai(); });

function chonDong(rows, cach){
  const g = {};
  rows.slice().sort((a,b)=>a.t-b.t).forEach(r=>{ (g[key(r)] = g[key(r)] || []).push(r); });
  let out = [];
  Object.values(g).forEach(arr=>{
    arr.forEach((r,i)=>{ r.lan = i+1; r.soLan = arr.length; });
    if(cach==="tatca") out.push(...arr);
    else if(cach==="cao") out.push(arr.slice().sort((a,b)=> b.score-a.score || a.timeUsed-b.timeUsed)[0]);
    else out.push(arr[0]);
  });
  out.sort((a,b)=> b.score-a.score || a.timeUsed-b.timeUsed || a.t-b.t);
  let h = 0; out.forEach((r,i)=>{ if(i===0 || r.score!==out[i-1].score || r.timeUsed!==out[i-1].timeUsed) h = i+1; r.hang = h; });
  return out;
}
function thongKe(list){
  const sc = list.map(r=>r.score), tb = sc.reduce((a,b)=>a+b,0)/sc.length;
  return `<div class="stats">${[
    [list.length, $("chon-cach").value==="tatca" ? "lượt nộp" : "học sinh đã nộp"], [tb.toFixed(2), "điểm trung bình"],
    [Math.max(...sc).toFixed(2), "cao nhất"], [Math.min(...sc).toFixed(2), "thấp nhất"],
    [Math.round(sc.filter(x=>x>=5).length*100/sc.length) + "%", "đạt từ 5 điểm"]
  ].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("")}</div>`;
}

    ${ds.length ? Object.keys(theoLop).sort().map(l=>`<h3 style="margin:12px 0 6px;font-size:15px">Lớp ${esc(l)} – ${theoLop[l].length} em chưa nộp</h3>

/* ---------- trình chiếu chữa bài: đề gốc + tỉ lệ chọn từng phương án của lớp ---------- */
// Đề gốc lấy tự động: (1) từ link bài trong cau_hinh.js (trang cc_….html chứa đề nén #e=…), (2) từ Ngân hàng đề (trang tính DeThi).
const DE_CACHE = {};
const rutGon = s => { let t = String(s==null?"":s).replace(/\s+/g," ").trim();
  if(t.length>220){ t = t.slice(0,220); if((t.match(/\$/g)||[]).length%2) t = t.slice(0, t.lastIndexOf("$")); t = t.trim() + "…"; } return t; };
const giaiNen = e => { try{ return window.LZString ? JSON.parse(LZString.decompressFromEncodedURIComponent(e)) : null; }catch(x){ return null; } };
const choThuVien = ()=> new Promise(r=>{ let n = 0; const t = ()=> (window.LZString || ++n > 50) ? r() : setTimeout(t, 100); t(); });
async function taiDeGoc(ma){
  if(DE_CACHE[ma]) return DE_CACHE[ma];
  await choThuVien();
  let de = null;
  const b = BAI.find(x=>x.ma===ma), url = b ? linkBai(b) : "";
  try{
    if(url){
      const u = new URL(url), id = u.searchParams.get("de");
      if(/#e=/.test(u.hash)) de = giaiNen(u.hash.slice(3));
      else if(id){ const d = await jsonp({action:"de", id}); de = JSON.parse(d.de); }
      else { const html = await (await fetch(url, {cache:"no-cache"})).text(), m = html.match(/#e=([A-Za-z0-9+\-$_]+)/); if(m) de = giaiNen(m[1]); }
    }
    if(!de && MA){
      const d = await jsonp({action:"dsDe", key:MA}), x = (d.ds||[]).find(z=> z.tieuDe===ma || z.id===ma);
      if(x){ const r = await jsonp({action:"de", id:x.id}); de = JSON.parse(r.de); }
    }
  }catch(e){ de = null; }
  if(de && de.parts) de.parts.forEach(p=> p.questions.forEach(q=>{ if(typeof q.content!=="string") q.content = String(q.content||""); }));
  if(de && de.parts) DE_CACHE[ma] = de;   // chỉ ghi nhớ khi tải được – lỗi mạng thì lần sau thử lại
  return (de && de.parts) ? de : null;
}
let TC = {i:0, hien:false};
function richTC(t){ return esc(t).replace(/⟪([^⟫]+)⟫/g, "<u>$1</u>").replace(/\n/g, "<br>"); }
function thongKeCau(de){
  // Mỗi câu: {p, c, loai, q, n, ok, ...} theo thứ tự đề gốc; bài làm gom theo (phần, số câu gốc)
  const theo = {};
  LIST.forEach(r=> (r.answers||[]).forEach(a=>{ (theo[a.p+"|"+a.c] = theo[a.p+"|"+a.c] || []).push(a); }));
  const ds = [];
  if(de) de.parts.forEach((part,pi)=> part.questions.forEach((q,qi)=>{
    const arr = theo[(pi+1)+"|"+(qi+1)] || [], o = {p:pi+1, c:qi+1, loai:part.type, part, q, n:arr.length, ok:arr.filter(a=>a.ok).length, arr};
    if(part.type==="mcq") o.dem = q.options.map(op=> arr.filter(a=> a.chon===rutGon(op.t)).length), o.trong = arr.filter(a=>!a.chon).length;
    if(part.type==="tf") o.ydung = q.statements.map((st,si)=> arr.filter(a=> (a.chon||"")[si] === (st.correct ? "Đ" : "S")).length);
    if(part.type==="short"){ const sai = {}; arr.filter(a=>!a.ok).forEach(a=>{ const k = a.chon || "(bỏ trống)"; sai[k] = (sai[k]||0)+1; }); o.sai = Object.entries(sai).sort((x,y)=>y[1]-x[1]).slice(0,4); }
    ds.push(o);
  }));
  else Object.values(theo).forEach(arr=>{ const a0 = arr[0]; ds.push({p:a0.p, c:a0.c, loai:"?", q:{content:a0.q}, n:arr.length, ok:arr.filter(a=>a.ok).length, arr, dungTxt:a0.dung}); });
  return ds.sort((x,y)=> x.p-y.p || x.c-y.c);
}
async function veTrinhChieu(){
  const box = $("noi-dung-chinh");
  if(!MA){ box.innerHTML = '<div class="msg" style="padding:20px;text-align:center">Trình chiếu chữa bài dùng bài làm của từng học sinh nên chỉ mở khi giáo viên đăng nhập.</div>'; return; }
  box.innerHTML = '<span class="msg">Đang tải đề gốc…</span>';
  const ma = CHON, de = await taiDeGoc(ma);
  if(VIEW!=="trinhchieu" || CHON!==ma) return;
  const ds = thongKeCau(de);
  if(!ds.length){ box.innerHTML = '<div class="msg" style="padding:20px;text-align:center">Chưa tải được đề gốc và chưa có bài nộp để thống kê.</div>'; return; }
  if(TC.ma !== ma){ TC = {ma, i:0, hien:false}; }
  TC.i = Math.min(TC.i, ds.length-1);
  const ti = o => o.n ? Math.round(o.loai==="tf" ? o.ydung.reduce((a,b)=>a+b,0)*100/(4*o.n) : o.ok*100/o.n) : null;
  const xau = o => { const t = ti(o); return t!==null && t < 50; };
  const o = ds[TC.i], t = ti(o), so = (o.p===1 ? "" : "Phần " + o.p + " – ") + "Câu " + o.c;
  let than = "";
  if(o.loai==="mcq") than = o.q.options.map((op,k)=>{ const pc = o.n ? Math.round(o.dem[k]*100/o.n) : 0, d = TC.hien && op.l===o.q.correct;
      return `<div class="tc-pa ${d?'dung':''}"><span class="l">${esc(op.l)}</span><span>${richTC(op.t)}${d?' <b style="color:#16A34A">✓</b>':''}</span><span><div class="bar"><i style="width:${pc}%"></i></div><div class="pct">${o.dem[k]} HS · ${pc}%</div></span></div>`; }).join("")
      + (o.trong ? `<p class="msg" style="margin:4px 0 0">${o.trong} học sinh bỏ trống.</p>` : "");
  else if(o.loai==="tf") than = o.q.statements.map((st,si)=>{ const pc = o.n ? Math.round(o.ydung[si]*100/o.n) : 0;
      return `<div class="tc-pa ${TC.hien?'dung':''}" style="${TC.hien && pc<50 ? 'border-color:#DC2626;background:#FEF2F2' : ''}"><span class="l">${"abcd"[si]})</span><span>${richTC(st.text)}${TC.hien ? ` <b style="color:${st.correct?'#16A34A':'#991B1B'}">${st.correct?'Đúng':'Sai'}</b>` : ""}</span><span><div class="bar"><i style="width:${pc}%"></i></div><div class="pct">${pc}% làm đúng</div></span></div>`; }).join("");
  else if(o.loai==="short") than = `<div class="tc-pa ${TC.hien?'dung':''}"><span class="l">ĐS</span><span>${TC.hien ? "Đáp án: <b>" + esc(o.q.answer) + "</b>" : "Đáp án ẩn – bấm “Hiện đáp án”"}</span><span><div class="bar"><i style="width:${t||0}%"></i></div><div class="pct">${o.ok}/${o.n} HS đúng</div></span></div>`
      + (o.sai && o.sai.length ? `<p class="msg" style="margin:6px 0 0">Câu trả lời sai nhiều nhất: ${o.sai.map(([k,v])=>`<b>${esc(k)}</b> (${v} HS)`).join(", ")}</p>` : "");
  else than = `<p class="msg">Chưa tải được đề gốc của bài này – chỉ hiện nội dung rút gọn từ bài làm. ${TC.hien ? "Đáp án: <b>" + esc(o.dungTxt) + "</b>" : ""}</p>`;
  const giai = [o.q.expl, ...(o.loai==="tf" ? o.q.statements.map((st,si)=> st.expl ? "abcd"[si] + ") " + st.expl : "") : [])].filter(Boolean);
  box.innerHTML = `<p class="msg" style="margin:0 0 8px;font-size:13px">Trình chiếu từng câu kèm tỉ lệ lựa chọn của ${o.n ? "lớp" : "học sinh"}${LOP ? " " + esc(LOP) : ""} (${LIST.length} bài nộp). Câu có tỉ lệ đúng dưới 50% được viền đỏ – nên chữa kĩ. Bấm “Chiếu toàn màn hình” để trình chiếu.</p>
    <div class="tc-tong">${ds.map((x,k)=>{ const p = ti(x); return `<button class="tc-chip ${xau(x)?'xau':''} ${k===TC.i?'on':''}" data-k="${k}">${x.p===1?'':'P'+x.p+'.'}${x.c}<small>${p===null?'–':p+'%'}</small></button>`; }).join("")}</div>
    <div class="tc-cau ${xau(o)?'xau':''}">
      <div class="tc-dau"><span class="tc-so">${so}</span>${xau(o) ? '<span class="tc-canh">Tỉ lệ đúng ' + t + '% – cần chữa kĩ</span>' : t!==null ? '<span class="msg">Tỉ lệ đúng ' + t + '%</span>' : ''}</div>
      ${o.part && o.part.passage && o.c===1 ? `<div class="tc-giai" style="margin:0 0 12px">${richTC(o.part.passage)}</div>` : ""}
      <div class="tc-nd">${richTC(o.q.content)}${o.q.imageUrl ? `<img src="${esc(o.q.imageUrl)}" alt="Hình minh hoạ câu ${o.c}">` : ""}</div>
      ${than}
      ${TC.hien && giai.length ? `<div class="tc-giai"><b>Lời giải.</b> ${giai.map(richTC).join("<br>")}</div>` : ""}
      <div class="tc-nav"><button class="btn ghost" id="tc-truoc" ${TC.i===0?'disabled':''}>← Câu trước</button>
        <button class="btn" id="tc-hien">${TC.hien ? "Ẩn đáp án" : "Hiện đáp án và lời giải"}</button>
        <button class="btn ghost" id="tc-sau" ${TC.i===ds.length-1?'disabled':''}>Câu sau →</button></div>
    </div>`;
  toan(box);
  const di = k => { TC.i = k; TC.hien = false; veTrinhChieu(); };
  box.querySelectorAll(".tc-chip").forEach(b=> b.onclick = ()=> di(+b.dataset.k));
  $("tc-truoc").onclick = ()=> di(TC.i-1); $("tc-sau").onclick = ()=> di(TC.i+1);
  $("tc-hien").onclick = ()=>{ TC.hien = !TC.hien; veTrinhChieu(); };
}

function xuatCSV(){
  if(!LIST.length) return;
  const mau = (LIST.slice().sort((a,b)=>(b.answers||[]).length-(a.answers||[]).length)[0].answers||[]).slice().sort((x,y)=>x.p-y.p||(x.c||0)-(y.c||0));
  const head = ["Hạng","Họ tên","Lớp","Điểm","Thời gian (giây)","Nộp lúc","Lần làm","Điểm từng phần"].concat(mau.map(a=>"Phần " + a.p + " – Câu " + (a.c||"") + " (Đ/S)"));
  const q = v => '"' + String(v==null?"":v).replace(/"/g,'""') + '"';
  const lines = [head.map(q).join(",")].concat(LIST.map(r=>[r.hang, r.name, r.lop, r.score.toFixed(2).replace(".",","), r.timeUsed, new Date(r.t).toLocaleString("vi-VN"), r.lan+"/"+r.soLan, r.parts]
    .concat((r.answers||[]).slice().sort((x,y)=>x.p-y.p||(x.c||0)-(y.c||0)).map(a=> a.ok ? "Đ" : "S")).map(q).join(",")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "KetQua_" + baiHienTai().ten.replace(/[^\p{L}\p{N}]+/gu,"_").slice(0,50) + (LOP ? "_" + LOP : "") + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
