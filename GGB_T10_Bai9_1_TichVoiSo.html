<style>

header{background:#1E40AF;color:#fff;padding:10px 16px} header h1{margin:0;font-size:22px}

<header><h1>Tiết 1 – Vectơ k·a</h1><div>Bài 9. Tích của một vectơ với một số – Toán 10 · GeoGebra</div></header>
<nav><a href="GGB_T10_Bai9_1_TichVoiSo.html" class=on>Vectơ k·a</a><a href="GGB_T10_Bai9_2_KhoiTam.html">Điểm khối tâm thanh đòn</a></nav>
<p class="hd">Kéo thanh trượt k và điểm A. k &gt; 0: k·a cùng hướng a; k &lt; 0: ngược hướng; độ dài |k|·|a|.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["k=Slider(-3,3,0.5)", "SetValue(k,2)", "O=(0,0)", "A=(2,1)", "a=Vector(O,A)", "SetColor(a,\"#2563EB\")", "SetLineThickness(a,8)", "K=O+k*a", "ka=Vector(O,K)", "SetColor(ka,\"#DC2626\")", "SetLineThickness(ka,5)", "doDaiA=Length(a)", "doDaiKA=Length(ka)", "ShowGrid(true)"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"classic", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AG",
  appletOnLoad:function(api){ const loi=[]; CMDS.forEach(c=>{ if(!api.evalCommand(c)) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | "); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
