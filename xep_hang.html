<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng xếp hạng</title>
<script src="cau_hinh.js"></script>
<style>
  :root{--paper:#F8F9FA;--line:#DAD6C8;--ink:#1E293B;--soft:#55655C;--cel:#4F7566;--deep:#33473D;--gold:#B98B2E;--good:#5C7A4E;--bad:#A8402F;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 40px}
  header{background:var(--deep);color:#fff;border-radius:14px;padding:18px 20px;margin-bottom:14px}
  header h1{margin:0;font-size:22px}
  header .sub{opacity:.85;font-size:13.5px;margin-top:4px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
  .bar label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:4px}
  select{padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;font-size:14.5px;background:#fff;max-width:100%}
  .grow{flex:1;min-width:220px}.grow select{width:100%}
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
  .stat b{display:block;font-size:22px;color:var(--deep)}
  .stat span{font-size:12.5px;color:var(--soft)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #EEEBE1}
  th{background:#EAF0E4;font-size:13px;color:var(--deep)}
  td.num,th.num{text-align:center;white-space:nowrap}
  tr.top1 td{background:#FFF6DC}tr.top2 td{background:#F3F4F6}tr.top3 td{background:#FBEFE6}
  .score{font-weight:700;font-size:16px}
  .rank{font-weight:700;font-size:16px}
  .empty,.err{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--soft)}
  .err{color:var(--bad)}
  .foot{font-size:12.5px;color:var(--soft);margin-top:10px}
  @media (max-width:560px){th.hide,td.hide{display:none}th,td{padding:8px 7px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏆 Bảng xếp hạng</h1>
    <div class="sub" id="tieude">Đang tải…</div>
  </header>
  <div class="bar">
    <div class="grow"><label for="chon-bai">Bài làm</label><select id="chon-bai"></select></div>
    <div><label for="chon-lop">Lớp</label><select id="chon-lop"><option value="">Tất cả các lớp</option></select></div>
  </div>
  <div class="stats" id="stats"></div>
  <div id="bang"></div>
  <div class="foot">Xếp theo điểm cao hơn; bằng điểm thì ai làm nhanh hơn xếp trên. Mỗi học sinh chỉ tính lần làm đầu tiên. Bảng tự cập nhật mỗi 20 giây.</div>
</div>
<script>
const Q = new URLSearchParams(location.search);
let DATA = [], QUIZZES = [];
function jsonp(params){
  return new Promise((res, rej)=>{
    const api = window.KQ_API || "";
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(api)) return rej("Chưa cấu hình địa chỉ nhận kết quả (cau_hinh.js).");
    const cb = "cb_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const t = setTimeout(()=>{ cleanup(); rej("Không kết nối được máy chủ kết quả."); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); d && d.ok ? res(d) : rej((d && d.loi) || "Lỗi dữ liệu"); };
    s.onerror = ()=>{ cleanup(); rej("Không kết nối được máy chủ kết quả."); };
    s.src = api + "?" + new URLSearchParams({...params, callback: cb}).toString();
    document.body.appendChild(s);
  });
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = r => r.name.toLowerCase().normalize("NFC").replace(/\s+/g," ").trim() + "|" + r.lop;
function tg(s){ s = Math.max(0, s|0); return Math.floor(s/60) + " ph " + String(s%60).padStart(2,"0") + " s"; }
function xepHang(rows){
  const first = {};
  rows.slice().sort((a,b)=>a.t-b.t).forEach(r=>{ const k = key(r); if(!first[k]) first[k] = r; });
  const list = Object.values(first).sort((a,b)=> b.score-a.score || a.timeUsed-b.timeUsed || a.t-b.t);
  let hang = 0;
  list.forEach((r,i)=>{ if(i===0 || r.score!==list[i-1].score || r.timeUsed!==list[i-1].timeUsed) hang = i+1; r.hang = hang; });
  return list;
}
function ve(){
  const lop = document.getElementById("chon-lop").value;
  const rows = DATA.filter(r=> !lop || r.lop===lop);
  const list = xepHang(rows);
  const st = document.getElementById("stats");
  if(!list.length){ st.innerHTML = ""; document.getElementById("bang").innerHTML = '<div class="empty">Chưa có học sinh nào nộp bài.</div>'; return; }
  const tb = list.reduce((s,r)=>s+r.score,0)/list.length;
  const dat = list.filter(r=>r.score>=5).length;
  st.innerHTML = `<div class="stat"><b>${list.length}</b><span>học sinh đã nộp</span></div>
    <div class="stat"><b>${tb.toFixed(2)}</b><span>điểm trung bình</span></div>
    <div class="stat"><b>${Math.round(dat*100/list.length)}%</b><span>đạt từ 5 điểm</span></div>`;
  const md = ["🥇","🥈","🥉"];
  document.getElementById("bang").innerHTML = `<table><thead><tr><th class="num">Hạng</th><th>Họ tên</th><th class="num">Lớp</th><th class="num">Điểm</th><th class="num hide">Thời gian làm</th></tr></thead><tbody>` +
    list.map(r=>`<tr class="${r.hang<=3?'top'+r.hang:''}"><td class="num rank">${r.hang<=3?md[r.hang-1]:r.hang}</td><td>${esc(r.name)}</td><td class="num">${esc(r.lop)}</td><td class="num score">${r.score.toFixed(2)}</td><td class="num hide">${tg(r.timeUsed)}</td></tr>`).join("") + `</tbody></table>`;
}
async function taiBai(){
  const q = document.getElementById("chon-bai").value;
  if(!q){ document.getElementById("bang").innerHTML = '<div class="empty">Chưa có bài nào được nộp.</div>'; return; }
  const qz = QUIZZES.find(x=>x.quizId===q);
  document.getElementById("tieude").textContent = (qz && qz.title) || q;
  try{
    const d = await jsonp({action:"rank", quiz:q});
    DATA = d.rows;
    const sel = document.getElementById("chon-lop"), cur = sel.value || Q.get("lop") || "";
    const lops = [...new Set(DATA.map(r=>r.lop).filter(Boolean))].sort();
    sel.innerHTML = '<option value="">Tất cả các lớp</option>' + lops.map(l=>`<option ${l===cur?"selected":""}>${esc(l)}</option>`).join("");
    ve();
  }catch(e){ document.getElementById("bang").innerHTML = `<div class="err">⚠ ${esc(e)}</div>`; }
}
async function khoiDong(){
  try{
    const d = await jsonp({action:"quizzes"});
    QUIZZES = d.quizzes;
    const want = Q.get("q");
    if(want && !QUIZZES.find(x=>x.quizId===want)) QUIZZES.unshift({quizId:want, title:want, count:0});
    document.getElementById("chon-bai").innerHTML = QUIZZES.map(x=>`<option value="${esc(x.quizId)}" ${x.quizId===want?"selected":""}>${esc(x.title||x.quizId)} (${x.count} lượt)</option>`).join("");
    await taiBai();
  }catch(e){ document.getElementById("tieude").textContent = ""; document.getElementById("bang").innerHTML = `<div class="err">⚠ ${esc(e)}</div>`; }
}
document.getElementById("chon-bai").addEventListener("change", ()=>{ document.getElementById("chon-lop").value=""; taiBai(); });
document.getElementById("chon-lop").addEventListener("change", ve);
khoiDong();
setInterval(()=>{ if(!document.hidden) taiBai(); }, 20000);
</script>
</body>
</html>
