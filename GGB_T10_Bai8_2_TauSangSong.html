<header><h1>Tiết 2 – Tàu sang sông nhanh nhất</h1><div>Bài 8. Tổng và hiệu của hai vectơ – Toán 10 · GeoGebra</div></header>
<nav><a href="GGB_T10_Bai8_1_HinhBinhHanh.html">Quy tắc hình bình hành</a><a href="GGB_T10_Bai8_2_TauSangSong.html" class=on>Tàu sang sông nhanh nhất</a></nav>
<p class="hd">Kéo thanh trượt α (góc lái so với bờ). Vectơ đỏ là vận tốc thực tế v = vr + vn. Thời gian sang bờ (sông rộng 4) nhỏ nhất khi α = 90°.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["α=Slider(10°,170°,1°)", "SetValue(α,60°)", "b1=Line((0,0),(1,0))", "b2=Line((0,4),(1,4))", "SetColor(b1,\"#0EA5E9\")", "SetColor(b2,\"#0EA5E9\")", "A=(0,0)", "M=A+(3cos(α),3sin(α))", "N=M+(1.5,0)", "vr=Vector(A,M)", "SetColor(vr,\"#2563EB\")", "SetLineThickness(vr,6)", "vn=Vector(M,N)", "SetColor(vn,\"#16A34A\")", "SetLineThickness(vn,6)", "v=Vector(A,N)", "SetColor(v,\"#DC2626\")", "SetLineThickness(v,8)", "thoiGian=4/y(M)"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"classic", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AG",
  appletOnLoad:function(api){ const loi=[]; CMDS.forEach(c=>{ if(!api.evalCommand(c)) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | "); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
