<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kiểm Định Học Liệu Số - THPT Vĩnh Thạnh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f5f7fa; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #0056b3; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 15px 0; background: #eef5fc; padding: 10px; border-radius: 6px; }
        .btn-submit { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #218838; }
        .btn-submit:disabled { background-color: #6c757d; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 CỔNG LÀM BÀI TRỰC TUYẾN BẢO MẬT NGẦM</h2>
    
    <!-- KHU VỰC ĐỊNH DANH HỌC SINH -->
    <div class="form-group">
        <label for="txt_hoten">🧑‍🎓 Họ và tên Học sinh:</label>
        <input type="text" id="txt_hoten" placeholder="Nhập đầy đủ họ và tên của em...">
    </div>
    
    <div class="form-group">
        <label for="sel_lop">🏫 Chọn Lớp học:</label>
        <select id="sel_lop">
            <option value="">-- Bấm vào đây để chọn Lớp --</option>
            <option value="TD_Nhom_TuDo">Lớp: Học sinh tự do (Trường ngoài)</option>
            <!-- Con trai thầy giữ nguyên cụm danh sách 21 lớp chính khóa cũ ở đây -->
            <option value="10A1">Lớp 10A1</option>
            <option value="11A1">Lớp 11A1</option>
            <option value="12A1">Lớp 12A1</option>
        </select>
    </div>

    <!-- CÁC Ô CHỨA DỮ LIỆU ĐỀ VÀ PHÂN LUỒNG ẨN (NÉN TRONG LINK) -->
    <input type="hidden" id="txt_made" value="De_OnTap_Thang10">
    <input type="hidden" id="txt_magv_hidden" value="GV01"> 
    <input type="hidden" id="txt_sheet_hidden" value="">

    <!-- KHU VỰC HIỂN THỊ NỘI DUNG CÂU HỎI TRẦN (KHÔNG CHỨA ĐÁP ÁN ĐÚNG) -->
    <div id="vung_chua_cau_hoi">
        <!-- Mã JavaScript cũ của thầy tự động đổ câu hỏi Word thô vào đây -->
        <p><b>Câu 1:</b> Nội dung câu hỏi trắc nghiệm hiển thị trần tại đây...</p>
    </div>

    <button type="button" id="btn_nopbai" class="btn-submit" onclick="xuLyNopBaiBaoMat()">🚀 BẤM NỘP BÀI CHẤM NGẦM</button>
</div>

<script>
// =========================================================================
// LUỒNG XỬ LÝ NỘP BÀI BẢO MẬT SERVER-SIDE CHỐNG GIAN LẬN ĐIỂM
// =========================================================================
function xuLyNopBaiBaoMat() {
    const hoTen = document.getElementById("txt_hoten").value.trim();
    const lop = document.getElementById("sel_lop").value;
    const maDe = document.getElementById("txt_made").value;
    
    // Đọc tham số bảo mật phân luồng nhúng ngầm
    const maGV_Goc = document.getElementById("txt_magv_hidden").value; 
    const urlSheetRieng = document.getElementById("txt_sheet_hidden").value; 

    if (!hoTen || !lop) {
        alert("Vui lòng nhập Họ tên và chọn đúng Lớp học để lưu điểm số!");
        return;
    }

    // 1. THU THẬP CHUỖI ĐÁP ÁN TRẦN - TUYỆT ĐỐI KHÔNG CHẤM ĐIỂM TẠI MÁY HỌC SINH
    let chuoiDapAnTran = {
        phan1: [], // Chỉ lưu mảng đáp án học sinh chọn: ["A", "B", "D", ...]
        phan2: [], // Chỉ lưu mảng đúng sai: [["Đ","S","S","Đ"], ...]
        phan3: []  // Chỉ lưu đáp án điền số trả lời ngắn: ["4.56", "12", ...]
    };

    // [Giữ nguyên cấu trúc các vòng lặp for quét radio/checkbox cũ của con trai thầy tại đây]
    // Ví dụ gom mẫu câu trả lời Phần I:
    // chuoiDapAnTran.phan1.push("A"); 

    // 2. PHÂN LUỒNG ĐƯỜNG TRUYỀN POST NGẦM THÔNG MINH
    // Mặc định chạy về Sheet tổng của nhà trường Vĩnh Thạnh
    let webAppUrl = "https://google.com";
    
    // Nếu link sinh ra từ Giáo viên tự do (GUEST), máy tự động rẽ nhánh đẩy điểm về Drive riêng của họ
    if (maGV_Goc === "GUEST" && urlSheetRieng) {
        webAppUrl = urlSheetRieng; 
    }

    const payload = {
        maDe: maDe,
        maGV: maGV_Goc,
        hoTen: hoTen,
        lop: lop,
        answers: chuoiDapAnTran // Gửi chuỗi trần trọc, Server Google tự đối chiếu đáp án gốc lưu ngầm để chấm
    };

    // Khóa cứng nút nộp bài chống học sinh bấm liên tục phá hoại bom gói tin
    const btnNop = document.getElementById("btn_nopbai");
    if(btnNop) {
        btnNop.disabled = true;
        btnNop.innerText = "⏳ Đang nạp bài lên hệ thống kiểm định ngầm...";
    }

    // Kích hoạt luồng truyền HTTP POST ngầm bảo mật
    fetch(webAppUrl, {
        method: "POST",
        mode: "no-cors", 
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(() => {
        alert("🚀 Nộp bài thành công! Bài làm của em đã được chuyển về máy chủ của Giáo viên để thẩm định và chấm điểm ngầm.");
        
        // Tắt hoàn toàn tính năng xem điểm tức thì để chống lộ điểm real-time
        // Chuyển hướng học sinh sang trang thông báo hoàn thành bài thi sạch sẽ
        window.location.href = "hoan_thanh.html";
    })
    .catch(error => {
        console.error("Lỗi kết nối mạng:", error);
        alert("Nghẽn mạng cục bộ, vui lòng thử bấm nộp lại bài!");
        if(btnNop) { btnNop.disabled = false; btnNop.innerText = "BẤM NỘP BÀI CHẤM NGẦM"; }
    });
}
</script>

</body>
</html>
