<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiết 2 – Ném xiên (Luyện tập 1)</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
body{margin:0;font-family:Calibri,Arial,sans-serif;background:#F8FAFC;color:#1E293B}
header{background:#1E40AF;color:#fff;padding:10px 16px;position:relative;overflow:hidden} header h1{margin:0;font-size:22px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:#EFF4FF}
nav a{padding:6px 10px;border-radius:16px;background:#fff;color:#1E40AF;text-decoration:none;border:1px solid #BFDBFE;font-size:15px}
nav a.on{background:#1E40AF;color:#fff}
p.hd{margin:8px 16px;font-size:18px} #ggb{margin:0 8px} #loi{color:#991B1B;margin:4px 16px}
</style></head><body>
<header><h1>Tiết 2 – Ném xiên (Luyện tập 1)</h1><div>Bài 4. Đạo hàm và bài toán tối ưu – Chuyên đề Toán 12 · GeoGebra</div></header>
<nav><a href="GGB_T12CD_Bai4_1_NguoiDanhCa.html">Người đánh cá (Ví dụ 1)</a><a href="GGB_T12CD_Bai4_2_NemXien.html" class=on>Ném xiên (Luyện tập 1)</a></nav>
<p class="hd">Kéo thanh trượt α (độ). Quỹ đạo y = −g/(2v₀²cos²α)·x² + x·tanα với v₀ = 9 m/s, g = 9,8 m/s². Tầm xa L = v₀²sin2α/g lớn nhất ≈ 8,27 m khi α = 45°.</p><div id="loi"></div><div id="ggb"></div>
<script>
const CMDS = ["a=Slider(5,85,1)", "SetValue(a,30)", "v=9", "g=9.8", "q(x)=If(0<=x<=v^2*sin(2a°)/g,-g/(2v^2*cos(a°)^2)*x^2+x*tan(a°))", "SetColor(q,\"#DB2777\")", "SetLineThickness(q,7)", "tamXa=v^2*sin(2a°)/g", "doCaoMax=v^2*sin(a°)^2/(2g)", "ShowGrid(true)", "ZoomIn(-0.5,-0.5,9,5)", "TRON11"];
const W = Math.max(600, window.innerWidth - 16), H = Math.max(420, window.innerHeight - 190);
const app = new GGBApplet({appName:"classic", width:W, height:H, language:"vi", showToolBar:false, showAlgebraInput:false,
  showMenuBar:false, enableRightClick:false, showResetIcon:true, enableShiftDragZoom:true, perspective:"AG",
  errorDialogsActive:false,
  appletOnLoad:function(api){
    // evalCommand trả false cả với lệnh định dạng (SetColor…) vì không tạo đối tượng mới → chỉ kiểm tra lệnh định nghĩa "ten=…".
    // Kiểm tra SAU khi chạy hết lệnh: bắt cả đối tượng bị xoá ngầm (vd. định nghĩa lại tên cạnh mà Polygon tự đặt).
    const loi=[], ten=[]; CMDS.forEach(c=>{ if(c==="TRON11") return; api.evalCommand(c); const m=c.match(/^(\w+)=/); if(m) ten.push([m[1],c]); });
    ten.forEach(([n,c])=>{ if(!api.exists(n)) loi.push(c); });
    if(loi.length) document.getElementById("loi").textContent = "Không chạy được lệnh: " + loi.join(" | ");
    // "TRON11": khung nhìn tỉ lệ trục 1:1 (đường tròn tròn, góc vuông không méo) – nới khung theo kích thước cửa sổ.
    if(CMDS.includes("TRON11")) setTimeout(()=>{ const p=JSON.parse(api.getViewProperties(1));
      const x0=p.xMin, y0=p.yMin, x1=x0+p.width*p.invXscale, y1=y0+p.height*p.invYscale;
      const s=Math.max((x1-x0)/p.width,(y1-y0)/p.height), cx=(x0+x1)/2, cy=(y0+y1)/2;
      api.evalCommand("ZoomIn("+(cx-s*p.width/2)+","+(cy-s*p.height/2)+","+(cx+s*p.width/2)+","+(cy+s*p.height/2)+")"); }, 300); } }, true);
window.addEventListener("load", ()=>app.inject("ggb"));
</script></body></html>
